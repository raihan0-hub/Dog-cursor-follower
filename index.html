<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive SVG Pointer Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f19;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- The SVG screen element targeted by the script -->
    <svg id="screen"></svg>

    <script>
        "use strict";

        // 1. Core Elements and Namespaces
        const screen = document.getElementById("screen");
        const xmlns = "http://www.w3.org/2000/svg";
        const xlinkns = "http://www.w3.org/1999/xlink";

        // 2. Fixed Global Variables (Declared properly for strict mode)
        let width = window.innerWidth;
        let height = window.innerHeight;
        let rad = 0;
        
        const pointer = {
            x: width / 2,
            y: height / 2
        };

        // 3. Create a dynamic visual element (a glowing dot to follow the pointer)
        const dot = document.createElementNS(xmlns, "circle");
        dot.setAttribute("r", "20");
        dot.setAttribute("fill", "#00ffff");
        dot.setAttribute("filter", "drop-shadow(0px 0px 10px #00ffff)");
        screen.appendChild(dot);

        // 4. Pointer Movement Listener
        window.addEventListener("pointermove", (e) => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
            rad = 0;
            
            // Instantly move the SVG visual element to the mouse position
            dot.setAttribute("cx", pointer.x);
            dot.setAttribute("cy", pointer.y);
        }, false);

        // 5. Window Resize Logic
        const resize = () => {
            width = window.innerWidth;
            height = window.innerHeight;
            
            // Update SVG viewport dimensions if needed
            screen.setAttribute("viewBox", `0 0 ${width} ${height}`);
        };

        window.addEventListener("resize", resize, false);
        
        // Run initial resize to calibrate dimensions on load
        resize();

    </script>
</body>
</html>
